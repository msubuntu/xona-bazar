<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:720px; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; background:#fff; }
  .wrap { position:relative; width:1280px; height:720px; display:flex; }
  .left { width:60%; padding:60px 60px 40px 70px; background:
     radial-gradient(1200px 500px at 0% 0%, #a06bff 0%, transparent 60%),
     radial-gradient(900px 500px at 100% 100%, #5a2bd8 0%, transparent 55%),
     linear-gradient(160deg, #6d35e6 0%, #4a1cb0 100%);
     color:#fff; position:relative; overflow:hidden; }
  .left::after { content:''; position:absolute; right:-140px; top:-140px; width:420px; height:420px; border-radius:50%;
     background:rgba(255,255,255,.06); }
  .left::before { content:''; position:absolute; right:-220px; top:120px; width:420px; height:420px; border-radius:50%;
     background:rgba(255,255,255,.05); }
  .brand { display:flex; align-items:center; gap:22px; }
  .brand img { width:78px; height:78px; border-radius:50%; border:4px solid #fff; object-fit:cover; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .brand b { font-size:44px; font-weight:800; letter-spacing:-1px; text-shadow:0 3px 12px rgba(0,0,0,.25); }
  .brand span { display:block; font-size:22px; font-weight:600; color:#e9ddff; margin-top:2px; text-shadow:0 2px 8px rgba(0,0,0,.2); }
  .headline { margin-top:64px; font-size:58px; font-weight:800; line-height:1.12; letter-spacing:-1.5px; text-shadow:0 4px 20px rgba(0,0,0,.3); }
  .sub { margin-top:20px; font-size:30px; font-weight:600; color:#f0e9ff; line-height:1.35; }
  .sub small { display:block; font-size:24px; font-weight:500; color:#cbb9ff; margin-top:6px; }
  .divider { margin:30px 0 0; width:110px; height:5px; border-radius:3px; background:linear-gradient(90deg,#47bfff,#a06bff); }
  .cta { margin-top:34px; display:inline-block; padding:18px 40px; border-radius:16px; background:#fff; color:#4a1cb0;
     font-size:30px; font-weight:800; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .cta small { display:block; font-size:20px; font-weight:600; color:#6d35e6; margin-top:4px; }
  .right { width:40%; background:#ffffff; display:flex; flex-direction:column; justify-content:center; gap:22px; padding:46px 40px 40px 0; }
  .photo { position:relative; width:100%; height:150px; border-radius:22px; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.12); border:1px solid #eee6ff; }
  .photo img { width:100%; height:100%; object-fit:cover; }
  .photo b { position:absolute; left:14px; bottom:12px; background:rgba(74,28,176,.92); color:#fff; font-size:17px; font-weight:700;
     padding:7px 14px; border-radius:20px; }
  .foot { position:absolute; left:70px; bottom:26px; display:flex; gap:26px; align-items:center; }
  .foot a { color:#dcc9ff; font-size:22px; font-weight:700; text-decoration:none; display:flex; align-items:center; gap:10px; }
  .foot a b { color:#fff; }
</style></head>
